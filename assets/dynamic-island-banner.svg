<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Dynamic Island Ultra</title><desc id="desc">Futuristic dark glass interface with a cyan and violet dynamic island.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D1A"/><stop offset=".55" stop-color="#111A32"/><stop offset="1" stop-color="#21143A"/></linearGradient>
 <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43E8FF"/><stop offset=".52" stop-color="#7D8BFF"/><stop offset="1" stop-color="#C16BFF"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#43E8FF" stop-opacity=".32"/><stop offset="1" stop-color="#43E8FF" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter><filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="520" rx="36" fill="url(#bg)"/>
<circle cx="180" cy="80" r="210" fill="url(#orb)" filter="url(#blur)"/><circle cx="1030" cy="440" r="240" fill="#A64DFF" opacity=".16" filter="url(#blur)"/>
<g opacity=".16" stroke="#9DBBFF"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200"/><path d="M150 0V520M300 0V520M450 0V520M600 0V520M750 0V520M900 0V520M1050 0V520"/></g>
<rect x="390" y="62" width="420" height="104" rx="52" fill="#000" opacity=".5" filter="url(#shadow)"/><rect x="390" y="54" width="420" height="104" rx="52" fill="#070A12" stroke="url(#glow)" stroke-width="2"/>
<circle cx="435" cy="106" r="10" fill="#43E8FF"/><circle cx="435" cy="106" r="19" fill="#43E8FF" opacity=".15"/>
<text x="470" y="101" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#F7FBFF" letter-spacing="2">ISLAND ACTIVE</text><text x="470" y="128" font-family="Inter,Arial,sans-serif" font-size="13" fill="#9BA8C1">SMART • FLOATING • CONNECTED</text>
<text x="600" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="3">DYNAMIC ISLAND</text><text x="600" y="334" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800" fill="url(#glow)" letter-spacing="7">ULTRA</text>
<text x="600" y="386" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#C5D1E8" letter-spacing="5">NEXT-GEN ANDROID EXPERIENCE</text>
<g transform="translate(380 430)"><rect width="440" height="48" rx="24" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".18"/><circle cx="28" cy="24" r="6" fill="#43E8FF"/><text x="52" y="30" font-family="Inter,Arial,sans-serif" font-size="14" fill="#EAF4FF" letter-spacing="2">FLOATING ASSISTIVE CONTROL</text></g>
</svg>
