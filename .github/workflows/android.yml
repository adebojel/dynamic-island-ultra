name: Android CI and Offline APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install stable Android API 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Enforce offline-only manifest and dependency policy
        shell: bash
        run: |
          if grep -RInE 'android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE|okhttp|retrofit|ktor-client|firebase|play-services' app/src app/build.gradle.kts; then
            echo "::error::Unexpected network permission or network SDK dependency found."
            exit 1
          fi
          echo "No network permissions or network SDK dependencies detected."

      - name: Run offline assistant unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and enforce 400 MiB project budget
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE_BYTES="$(stat -c%s "$APK")"
          MAX_BYTES=$((400 * 1024 * 1024))
          echo "APK size: $SIZE_BYTES bytes"
          if (( SIZE_BYTES > MAX_BYTES )); then
            echo "::error::APK exceeds the 400 MiB project budget."
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-ultra-v0.0.0-offline-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.0.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.0
          target_commitish: main
          name: Dynamic Island Ultra v0.0.0 — Offline Preview
          body: |
            Offline-only engineering preview.

            Includes the draggable floating island, local installed-app launcher, offline notes/calculator/utility assistant, and an app-owned PiP workspace.

            Android PiP applies only to activities that support it; this app cannot force third-party apps to use PiP.

            This APK is debug-signed for sideload testing, not a production Play Store release.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
