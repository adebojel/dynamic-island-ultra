name: Android CI and Versioned APK Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
      - 'firebase.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, sign APK/AAB and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Determine next patch release version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          LAST_PATCH="$(git tag --list 'v0.0.*' | sed -nE 's/^v0\.0\.([0-9]+)$/\1/p' | sort -n | tail -n 1)"
          LAST_PATCH="${LAST_PATCH:-0}"
          NEXT_PATCH=$((LAST_PATCH + 1))
          echo "VERSION_NAME=0.0.${NEXT_PATCH}" >> "$GITHUB_ENV"
          echo "Next patch release: 0.0.${NEXT_PATCH}; Android versionCode: $VERSION_CODE"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install stable Android API 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Enforce Android 8+ and offline-AI architecture policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'minSdk = 26' app/build.gradle.kts
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml; then
            echo "::error::APK install permission must not appear in the shared manifest."
            exit 1
          fi
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' app/src/github/AndroidManifest.xml
          grep -q 'buildConfigField("boolean", "ENABLE_GITHUB_APK_UPDATER", "true")' app/build.gradle.kts
          grep -q 'buildConfigField("boolean", "ENABLE_GITHUB_APK_UPDATER", "false")' app/build.gradle.kts
          grep -q 'openPlayStoreUpdates' app/src/main/java/com/adebojel/dynamicislandultra/MainActivity.kt
          grep -q 'if (!BuildConfig.ENABLE_GITHUB_APK_UPDATER)' app/src/main/java/com/adebojel/dynamicislandultra/update/AppUpdateActivity.kt
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="specialUse"' app/src/main/AndroidManifest.xml
          grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' app/src/main/AndroidManifest.xml
          grep -q 'addAction(R.drawable.ic_stat_island, "Stop", stopPendingIntent)' app/src/main/java/com/adebojel/dynamicislandultra/overlay/FloatingIslandService.kt
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'ads-mobile-sdk:1.7.0' app/build.gradle.kts
          grep -q 'user-messaging-platform:4.0.0' app/build.gradle.kts
          grep -q 'billing:9.1.0' app/build.gradle.kts
          BILLING_MANAGER="app/src/main/java/com/adebojel/dynamicislandultra/ads/PremiumBillingManager.kt"
          grep -q '.enableAutoServiceReconnection()' "$BILLING_MANAGER"
          grep -q 'refreshStore(existingClient)' "$BILLING_MANAGER"
          DISCONNECT_HANDLER="$(sed -n '/override fun onBillingServiceDisconnected()/,/^[[:space:]]*}/p' "$BILLING_MANAGER")"
          if grep -Eq 'billingClient\.endConnection|client[[:space:]]*=[[:space:]]*null' <<< "$DISCONNECT_HANDLER"; then
            echo "::error::Disconnected BillingClient must be retained for automatic reconnection."
            exit 1
          fi
          grep -q 'fragment-ktx:1.9.1' app/build.gradle.kts
          grep -q 'ca-app-pub-9305273212801233~4511201352' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".ads.AdCenterActivity"' app/src/main/AndroidManifest.xml
          if grep -RInE 'java\.net\.|okhttp|retrofit|ktor|HttpURLConnection|https?://' app/src/main/java/com/adebojel/dynamicislandultra/ai; then
            echo "::error::The built-in AI module must remain local-only and must not contain network clients or endpoints."
            exit 1
          fi
          echo "Android 8+ support and local-AI isolation checks passed. Internet is available to app features; AI stays offline by design."

      - name: Run Android unit tests for both distribution flavors
        run: gradle --no-daemon --stacktrace testGithubDebugUnitTest testPlayDebugUnitTest -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"

      - name: Prepare stable release signing key
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            KEY_PATH="$RUNNER_TEMP/dynamic-island-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing key is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing secrets are missing. A debug preview will be built, but no update-compatible GitHub Release will be published."
          fi

      - name: Build signed release APK and Android App Bundle
        if: steps.signing.outputs.ready == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleGithubRelease assemblePlayRelease bundlePlayRelease -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"

      - name: Build debug preview APK
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon --stacktrace assembleGithubDebug assemblePlayDebug -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"

      - name: Verify merged installer permissions for both release flavors
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          GITHUB_APK="app/build/outputs/apk/github/release/app-github-release.apk"
          PLAY_APK="app/build/outputs/apk/play/release/app-play-release.apk"
          test -x "$AAPT"
          test -s "$GITHUB_APK"
          test -s "$PLAY_APK"
          "$AAPT" dump permissions "$GITHUB_APK" | tee "$RUNNER_TEMP/github-permissions.txt"
          "$AAPT" dump permissions "$PLAY_APK" | tee "$RUNNER_TEMP/play-permissions.txt"
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$RUNNER_TEMP/github-permissions.txt"
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$RUNNER_TEMP/play-permissions.txt"; then
            echo "::error::Play flavor must not request REQUEST_INSTALL_PACKAGES."
            exit 1
          fi
          echo "Merged permissions passed: GitHub APK has installer permission; Play APK does not."

      - name: Verify stable release APK signature
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/github/release/app-github-release.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -q "Signer #1 certificate SHA-256 digest:" "$RUNNER_TEMP/apk-signature.txt"
          echo "APK signature verified; certificate fingerprint is shown in the workflow log."

      - name: Verify signed Android App Bundle and upload-key certificate
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" | tee "$RUNNER_TEMP/aab-certificate.txt"
          EXPECTED_CERT="7b2c2fe9ccc24320133e78402c7171d7a835e0d7b425f9119f8d8f1d871a8a0e"
          if ! tr -d ': ' < "$RUNNER_TEMP/aab-certificate.txt" | grep -qi "$EXPECTED_CERT"; then
            echo "::error::AAB upload-key certificate does not match the stable APK signing certificate."
            exit 1
          fi
          echo "AAB JAR signature and stable upload-key certificate verified."

      - name: Verify APK, calculate SHA-256 and write release metadata
        id: package
        shell: bash
        env:
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$SIGNING_READY" == "true" ]]; then
            SOURCE_APK="app/build/outputs/apk/github/release/app-github-release.apk"
            APK_NAME="app-release.apk"
          else
            SOURCE_APK="app/build/outputs/apk/github/debug/app-github-debug.apk"
            APK_NAME="app-debug-preview.apk"
          fi
          test -s "$SOURCE_APK"
          SIZE_BYTES="$(stat -c%s "$SOURCE_APK")"
          MAX_BYTES=$((400 * 1024 * 1024))
          echo "APK size: $SIZE_BYTES bytes"
          if (( SIZE_BYTES > MAX_BYTES )); then
            echo "::error::APK exceeds the 400 MiB project budget."
            exit 1
          fi
          cp "$SOURCE_APK" "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" > "dist/$APK_NAME.sha256"
          if [[ "$SIGNING_READY" == "true" ]]; then
            SOURCE_AAB="app/build/outputs/bundle/playRelease/app-play-release.aab"
            test -s "$SOURCE_AAB"
            AAB_SIZE_BYTES="$(stat -c%s "$SOURCE_AAB")"
            if (( AAB_SIZE_BYTES > MAX_BYTES )); then
              echo "::error::AAB exceeds the 400 MiB project budget."
              exit 1
            fi
            cp "$SOURCE_AAB" dist/app-release.aab
            sha256sum dist/app-release.aab > dist/app-release.aab.sha256
            cat > dist/release-info.json <<EOF
          {
            "packageName": "com.adebojel.dynamicislandultra",
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "minSdk": 26,
            "apkFlavor": "github",
            "bundleFlavor": "play",
            "playFlavorExcludesRequestInstallPackages": true,
            "apk": "app-release.apk",
            "sha256Asset": "app-release.apk.sha256",
            "bundle": "app-release.aab",
            "bundleSha256Asset": "app-release.aab.sha256",
            "commit": "$GITHUB_SHA"
          }
          EOF
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist/*

      - name: Upload APK and test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-ultra-${{ env.VERSION_NAME }}-${{ steps.signing.outputs.ready == 'true' && 'release' || 'debug-preview' }}
          path: |
            dist/*
            app/build/reports/tests/testGithubDebugUnitTest/
            app/build/reports/tests/testPlayDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub Release
        if: steps.package.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: main
          name: Dynamic Island Ultra v${{ env.VERSION_NAME }}
          body: |
            Automatically versioned Android release.

            - Android minimum: 8.0 Oreo / API 26.
            - Internet permission is available to app features. The bundled assistant and local tools remain offline by design.
            - The built-in assistant and local tools remain offline.
            - GitHub APK variant includes the SHA-256-verified GitHub self-updater for sideloaded distribution.
            - Play AAB variant excludes REQUEST_INSTALL_PACKAGES and sends users to Google Play for updates.
            - Signed APK and Android App Bundle (AAB), both SHA-256 checksums, and release-info.json are attached. Upload only the Play-flavor AAB to Play Console.
            - DuckDuckGo is the default browser/search engine, with desktop/mobile modes.
            - App-wide network permissions are enabled; the offline assistant remains local-only.
            - Google Mobile Ads Next-Gen and UMP are integrated. Debug builds use Google's official test units; signed release builds use the publisher's production IDs.
            - Banner and Native Advanced are confined to Bonus & Premium. Rewarded formats require direct user action and grant a 24-hour cosmetic Premium unlock.
            - Google Play Billing queries subscription product diu_premium; localized price and offers are read from Google Play.
            - The GitHub APK updater hands installation to Android's package installer after SHA-256 validation and user consent.
            - The Play flavor receives updates through Google Play and does not declare REQUEST_INSTALL_PACKAGES.
            - The GitHub APK is self-signed with the project's stable release key, not Google Play certified.
          files: |
            dist/app-release.apk
            dist/app-release.apk.sha256
            dist/app-release.aab
            dist/app-release.aab.sha256
            dist/release-info.json
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
