name: Android CI and Versioned APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.0.${{ github.run_number }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install stable Android API 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Enforce Android 8+ and offline-AI architecture policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'minSdk = 26' app/build.gradle.kts
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          if grep -RInE 'java\.net\.|okhttp|retrofit|ktor|HttpURLConnection|https?://' app/src/main/java/com/adebojel/dynamicislandultra/ai; then
            echo "::error::The built-in AI module must remain local-only and must not contain network clients or endpoints."
            exit 1
          fi
          echo "Android 8+ support and local-AI isolation checks passed. Internet is available to app features; AI stays offline by design."

      - name: Run offline assistant and local policy tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"

      - name: Prepare stable release signing key
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            KEY_PATH="$RUNNER_TEMP/dynamic-island-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing key is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing secrets are missing. A debug preview will be built, but no update-compatible GitHub Release will be published."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"

      - name: Build debug preview APK
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon --stacktrace assembleDebug -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"

      - name: Verify APK, calculate SHA-256 and write release metadata
        id: package
        shell: bash
        env:
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$SIGNING_READY" == "true" ]]; then
            SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="app-release.apk"
          else
            SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
            APK_NAME="app-debug-preview.apk"
          fi
          test -s "$SOURCE_APK"
          SIZE_BYTES="$(stat -c%s "$SOURCE_APK")"
          MAX_BYTES=$((400 * 1024 * 1024))
          echo "APK size: $SIZE_BYTES bytes"
          if (( SIZE_BYTES > MAX_BYTES )); then
            echo "::error::APK exceeds the 400 MiB project budget."
            exit 1
          fi
          cp "$SOURCE_APK" "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" > "dist/$APK_NAME.sha256"
          if [[ "$SIGNING_READY" == "true" ]]; then
            cat > dist/release-info.json <<EOF
          {
            "packageName": "com.adebojel.dynamicislandultra",
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "minSdk": 26,
            "apk": "app-release.apk",
            "sha256Asset": "app-release.apk.sha256",
            "commit": "$GITHUB_SHA"
          }
          EOF
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist/*

      - name: Upload APK and test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-ultra-${{ env.VERSION_NAME }}-${{ steps.signing.outputs.ready == 'true' && 'release' || 'debug-preview' }}
          path: |
            dist/*
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub Release
        if: steps.package.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: main
          name: Dynamic Island Ultra v${{ env.VERSION_NAME }}
          body: |
            Automatically versioned Android release.

            - Android minimum: 8.0 Oreo / API 26.
            - Internet permission is available to app features. The bundled assistant and local tools remain offline by design.
            - The built-in assistant and local tools remain offline.
            - SHA-256 checksum and release-info.json are attached.
            - DuckDuckGo is the default browser/search engine, with desktop/mobile modes.
            - App-wide network permissions are enabled; the offline assistant remains local-only.
            - AdMob requires publisher IDs and UMP consent setup before ads are enabled.
            - Install/update is handed to Android's package installer; user confirmation may be required.
            - This APK is self-signed with the project's stable release key, not Google Play certified.
          files: |
            dist/app-release.apk
            dist/app-release.apk.sha256
            dist/release-info.json
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
